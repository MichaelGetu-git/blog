<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d"><title id="t">Illustrative cost of the same project by region</title><desc id="d">Same 3,840 hours priced at regional midpoint rates. Africa lands at roughly a third of the North America and Western Europe price.</desc><rect width="1200" height="640" fill="#FBFAF6"/><rect x="0" y="0" width="1200" height="8" fill="#0F7B5F"/><rect x="0" y="0" width="400" height="8" fill="#0F7B5F"/><rect x="400" y="0" width="400" height="8" fill="#F2B01E"/><rect x="800" y="0" width="400" height="8" fill="#D9422B"/><text x="60" y="70" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="700" fill="#14231F" text-anchor="start">Same team, same hours, very different invoice</text><text x="60" y="106" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#6B7A75" text-anchor="start">4 developers x 6 months x 160 hours = 3,840 hours, priced at the midpoint of each regional range</text><text x="420" y="198.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="500" fill="#14231F" text-anchor="end">North America and Western Europe</text><rect x="440" y="165" width="539" height="50" rx="8" fill="#C9D1CD"/><text x="993.136" y="199.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#14231F" text-anchor="start">$499,200</text><text x="420" y="274.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="500" fill="#14231F" text-anchor="end">Latin America</text><rect x="440" y="241" width="270" height="50" rx="8" fill="#C9D1CD"/><text x="723.568" y="275.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#14231F" text-anchor="start">$249,600</text><text x="420" y="350.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="500" fill="#14231F" text-anchor="end">Eastern Europe</text><rect x="440" y="317" width="238" height="50" rx="8" fill="#C9D1CD"/><text x="692.4639999999999" y="351.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#14231F" text-anchor="start">$220,800</text><text x="420" y="426.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#14231F" text-anchor="end">Africa</text><rect x="440" y="393" width="187" height="50" rx="8" fill="#0F7B5F"/><text x="640.624" y="427.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#14231F" text-anchor="start">$172,800</text><text x="420" y="502.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="500" fill="#14231F" text-anchor="end">South and Southeast Asia</text><rect x="440" y="469" width="176" height="50" rx="8" fill="#C9D1CD"/><text x="630.256" y="503.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#14231F" text-anchor="start">$163,200</text><text x="60" y="612" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7A75" text-anchor="start">Illustration only. Midpoints of QArea 2026 ranges. Real quotes vary.</text><text x="1140" y="612" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#0F7B5F" text-anchor="end">ZemenayTech</text></svg>