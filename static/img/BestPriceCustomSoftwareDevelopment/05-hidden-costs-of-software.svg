<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d"><title id="t">The hidden costs behind a software quote</title><desc id="d">Large IT projects run 45 percent over budget and deliver 56 percent less value; maintenance adds 15 to 20 percent a year.</desc><rect width="1200" height="640" fill="#FBFAF6"/><rect x="0" y="0" width="1200" height="8" fill="#0F7B5F"/><rect x="0" y="0" width="400" height="8" fill="#0F7B5F"/><rect x="400" y="0" width="400" height="8" fill="#F2B01E"/><rect x="800" y="0" width="400" height="8" fill="#D9422B"/><text x="60" y="70" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="700" fill="#14231F" text-anchor="start">The sticker price is only the first invoice</text><text x="60" y="106" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#6B7A75" text-anchor="start">What the research says happens after the quote is signed</text><rect x="60" y="160" width="255" height="300" rx="16" fill="#FFFFFF" stroke="#E3E7E4" stroke-width="2"/><rect x="60" y="160" width="255" height="10" rx="5" fill="#D9422B"/><text x="187.5" y="270" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" fill="#D9422B" text-anchor="middle">+45%</text><text x="187.5" y="325" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#14231F" text-anchor="middle">average budget</text><text x="187.5" y="355" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#14231F" text-anchor="middle">overrun</text><text x="187.5" y="432" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7A75" text-anchor="middle">large IT projects</text><rect x="341" y="160" width="255" height="300" rx="16" fill="#FFFFFF" stroke="#E3E7E4" stroke-width="2"/><rect x="341" y="160" width="255" height="10" rx="5" fill="#F2B01E"/><text x="468.5" y="270" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" fill="#B07F00" text-anchor="middle">+7%</text><text x="468.5" y="325" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#14231F" text-anchor="middle">average schedule</text><text x="468.5" y="355" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#14231F" text-anchor="middle">overrun</text><text x="468.5" y="432" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7A75" text-anchor="middle">large IT projects</text><rect x="622" y="160" width="255" height="300" rx="16" fill="#FFFFFF" stroke="#E3E7E4" stroke-width="2"/><rect x="622" y="160" width="255" height="10" rx="5" fill="#D9422B"/><text x="749.5" y="270" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" fill="#D9422B" text-anchor="middle">-56%</text><text x="749.5" y="325" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#14231F" text-anchor="middle">less value delivered</text><text x="749.5" y="355" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#14231F" text-anchor="middle">than predicted</text><text x="749.5" y="432" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7A75" text-anchor="middle">large IT projects</text><rect x="903" y="160" width="255" height="300" rx="16" fill="#FFFFFF" stroke="#E3E7E4" stroke-width="2"/><rect x="903" y="160" width="255" height="10" rx="5" fill="#0F7B5F"/><text x="1030.5" y="270" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" fill="#0F7B5F" text-anchor="middle">15-20%</text><text x="1030.5" y="325" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#14231F" text-anchor="middle">of the build cost,</text><text x="1030.5" y="355" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#14231F" text-anchor="middle">every year, to</text><text x="1030.5" y="385" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#14231F" text-anchor="middle">maintain</text><text x="1030.5" y="432" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7A75" text-anchor="middle">common rule of thumb</text><text x="60" y="500" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#14231F" text-anchor="start">The first three figures come from a study of more than 5,400 IT projects with budgets above $15 million.</text><text x="60" y="530" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#14231F" text-anchor="start">Smaller projects behave differently, but the direction holds: scope and quality drive the real price.</text><text x="60" y="612" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7A75" text-anchor="start">Sources: McKinsey and Oxford (2012); industry maintenance guides.</text><text x="1140" y="612" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#0F7B5F" text-anchor="end">ZemenayTech</text></svg>