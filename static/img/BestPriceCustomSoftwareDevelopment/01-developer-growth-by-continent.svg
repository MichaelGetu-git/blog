<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-labelledby="t d"><title id="t">Developer growth by continent, 2019-2024</title><desc id="d">Africa grew its developer community 21 percent a year, the fastest of any continent.</desc><rect width="1200" height="680" fill="#FBFAF6"/><rect x="0" y="0" width="1200" height="8" fill="#0F7B5F"/><rect x="0" y="0" width="400" height="8" fill="#0F7B5F"/><rect x="400" y="0" width="400" height="8" fill="#F2B01E"/><rect x="800" y="0" width="400" height="8" fill="#D9422B"/><text x="60" y="70" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="700" fill="#14231F" text-anchor="start">Africa is growing developers faster than anyone</text><text x="60" y="106" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#6B7A75" text-anchor="start">Average annual growth in developers, 2019-2024 (%), with 2024 developer count</text><text x="1140" y="150" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#6B7A75" text-anchor="end">2024 developers</text><text x="310" y="211.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#14231F" text-anchor="end">Africa</text><rect x="330" y="180" width="542" height="46" rx="8" fill="#0F7B5F"/><text x="888.5" y="212.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#14231F" text-anchor="start">21.0%</text><text x="1140" y="211.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#14231F" text-anchor="end">4.7M</text><text x="310" y="281.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="500" fill="#14231F" text-anchor="end">South America</text><rect x="330" y="250" width="512" height="46" rx="8" fill="#C9D1CD"/><text x="857.5" y="282.0" font-family="Inter, '