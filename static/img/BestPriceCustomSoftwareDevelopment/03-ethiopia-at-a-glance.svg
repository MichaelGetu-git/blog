<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d"><title id="t">Ethiopia at a glance</title><desc id="d">Key demographic and technology numbers for Ethiopia.</desc><rect width="1200" height="700" fill="#FBFAF6"/><rect x="0" y="0" width="1200" height="8" fill="#0F7B5F"/><rect x="0" y="0" width="400" height="8" fill="#0F7B5F"/><rect x="400" y="0" width="400" height="8" fill="#F2B01E"/><rect x="800" y="0" width="400" height="8" fill="#D9422B"/><text x="60" y="70" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="700" fill="#14231F" text-anchor="start">Ethiopia at a glance</text><text x="60" y="106" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#6B7A75" text-anchor="start">A young, connected country with a fast-growing tech base</text><rect x="60" y="150" width="350" height="210" rx="16" fill="#FFFFFF" stroke="#E3E7E4" stroke-width="2"/><rect x="60" y="174" width="6" height="52" rx="3" fill="#0F7B5F"/><text x="88" y="220" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="800" fill="#0F7B5F" text-anchor="start">134M</text><text x="88" y="262" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#14231F" text-anchor="start">people, with a median age</text><text x="88" y="290" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#14231F" text-anchor="start">of 19.1</text><text x="88" y="338" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7A75" text-anchor="start">DataReportal, early 2025</text><rect x="435" y="150" width="350" height="210" rx="16" fill="#FFFFFF" stroke="#E3E7E4" stroke-width="2"/><rect x="435" y="174" width="6" height="52" rx="3" fill="#F2B01E"/><text x="463" y="220" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="800" fill="#0F7B5F" text-anchor="start">85.4M</text><text x="463" y="262" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#14231F" text-anchor="start">mobile connections</text><text x="463" y="338" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7A75" text-anchor="start">DataReportal, early 2025</text><rect x="810" y="150" width="350" height="210" rx="16" fill="#FFFFFF" stroke="#E3E7E4" stroke-width="2"/><rect x="810" y="174" width="6" height="52" rx="3" fill="#D9422B"/><text x="838" y="220" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="800" fill="#0F7B5F" text-anchor="start">94K+</text><text x="838" y="262" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#14231F" text-anchor="start">GitHub developers, up 32</text><text x="838" y="290" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#14231F" text-anchor="start">percent in a year</text><text x="838" y="338" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7A75" text-anchor="start">GitHub Octoverse 2023</text><rect x="60" y="385" width="350" height="210" rx="16" fill="#FFFFFF" stroke="#E3E7E4" stroke-width="2"/><rect x="60" y="409" width="6" height="52" rx="3" fill="#0F7B5F"/><text x="88" y="455" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="800" fill="#0F7B5F" text-anchor="start">$658M</text><text x="88" y="497" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#14231F" text-anchor="start">IT outsourcing market in</text><text x="88" y="525" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#14231F" text-anchor="start">2025</text><text x="88" y="573" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7A75" text-anchor="start">Statista Market Insights</text><rect x="435" y="385" width="350" height="210" rx="16" fill="#FFFFFF" stroke="#E3E7E4" stroke-width="2"/><rect x="435" y="409" width="6" height="52" rx="3" fill="#F2B01E"/><text x="463" y="455" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="800" fill="#0F7B5F" text-anchor="start">$1.09B</text><text x="463" y="497" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#14231F" text-anchor="start">forecast by 2029 (13.5</text><text x="463" y="525" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#14231F" text-anchor="start">percent a year)</text><text x="463" y="573" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7A75" text-anchor="start">Statista Market Insights</text><rect x="810" y="385" width="350" height="210" rx="16" fill="#FFFFFF" stroke="#E3E7E4" stroke-width="2"/><rect x="810" y="409" width="6" height="52" rx="3" fill="#D9422B"/><text x="838" y="455" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="800" fill="#0F7B5F" text-anchor="start">5M+</text><text x="838" y="497" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#14231F" text-anchor="start">enrolled in national coder</text><text x="838" y="525" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="#14231F" text-anchor="start">training</text><text x="838" y="573" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7A75" text-anchor="start">Government of Ethiopia and UAE, June 2026</text><text x="60" y="672" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7A75" text-anchor="start">Enrollment is not professional skill. See the caveat in the article.</text><text x="1140" y="672" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#0F7B5F" text-anchor="end">ZemenayTech</text></svg>